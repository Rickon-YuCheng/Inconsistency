[project]
name = "Inconsistency" # 建立新專案時再修改
version = "0.1.0"
description = "A professional deep learning research template with uv and DevContainer."
readme = "README.md"
requires-python = "==3.10.*"
license = {text = "MIT"}
# 這裡是你的核心依賴，放最通用的
dependencies = [
    "torch==2.4.1+cu121",
    "torchvision==0.19.1+cu121",
    "torchaudio==2.4.1+cu121",
    "transformers==4.35.2",
    "pandas>=2.3.3",
    "matplotlib>=3.10.8",
    "speechbrain==1.0.1",
    "requests>=2.28.1",
    "huggingface-hub==0.23.5",
    "scikit-learn>=1.7.2",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.11",
]

# 強制使用專業的 src 佈局
[tool.hatch.build.targets.wheel]
packages = ["src/Inconsistency"] # 記得要改

# 代碼格式檢查配置 (Ruff)
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# 這裡才是放忽略規則的地方
ignore = ["E701"]
